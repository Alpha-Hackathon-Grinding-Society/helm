[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Pinned compiler settings. Changing any of these changes the deployed runtime
# bytes and invalidates the artifact-identity record in docs/CLAIMS.md.
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./out" }]
gas_reports = ["*"]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
