[project]
name = "helm-agent"
version = "0.1.0"
description = "The model and the loop that propose Helm's stablecoin allocation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "eth-account>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
helm-train = "helm_agent.train:main"
helm-agent = "helm_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["helm_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
